name: Patch Data Engine

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-data-engine:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Patch data_engine.py
        shell: python
        run: |
          from pathlib import Path

          path = Path("app/src/main/python/data_engine.py")
          text = path.read_text(encoding="utf-8")

          replacements = [
              (
                  'RETRY_DELAY_SECONDS = 3.0',
                  'RETRY_DELAY_SECONDS = 0.75',
              ),
              (
                  '''          elif db_latest < reference_latest_date:
              failed[symbol] = (
                  "BEHIND_LATEST: DB has "
                  f"{db_latest.strftime('%Y-%m-%d')} "
                  "but reference is "
                  f"{reference_latest_date.strftime('%Y-%m-%d')}"
              )''',
                  '''          # A stock does not have to match NIFTY's latest date.
          # Any valid stored date is usable historical data.
          # Older valid data is classified as LAST AVAILABLE later.''',
              ),
              (
                  '''          if final_ts is None or final_ts < reference_latest_date:
              if final_ts is None:
                  still_failed[symbol] = "DB_VERIFICATION_FAILED: no stored date after retry"
              else:
                  still_failed[symbol] = "BEHIND_LATEST after retry: DB has " + final_ts.strftime("%Y-%m-%d")''',
                  '''          # Final verification only checks whether usable data exists.
          # It must not reject a valid older stock date merely because
          # NIFTY has a newer reference date.
          if final_ts is None:
              still_failed[symbol] = "DB_VERIFICATION_FAILED: no stored date after retry"''',
              ),
              (
                  '''          elif final_ts < reference_latest_date:
              final_failed[symbol] = retry_failed.get(
                  symbol,
                  f"BEHIND_LATEST: DB has {final_ts.strftime('%Y-%m-%d')} "
                  f"but reference is {reference_latest_date.strftime('%Y-%m-%d')}",
              )''',
                  '''          # A valid older date is LAST AVAILABLE, not a failure.
          # Only symbols with no usable DB date remain failed.''',
              ),
          ]

          for old, new in replacements:
              if old not in text:
                  raise SystemExit(
                      "PATCH FAILED: expected code block not found."
                  )
              text = text.replace(old, new, 1)

          path.write_text(text, encoding="utf-8")

      - name: Python syntax check
        run: |
          python -m py_compile app/src/main/python/data_engine.py

      - name: Commit patched file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add app/src/main/python/data_engine.py

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Fix data engine latest-date verification"
          git push
